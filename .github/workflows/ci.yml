name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deh-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test without API credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node for the dashboard checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build the single-file local dashboard
        run: python scripts/build_dashboard.py

      - name: Build the dashboard preview without API access
        run: python scripts/build_preview.py

      - name: Run offline Python tests
        run: python -m unittest discover -s tests -v

      - name: Check dashboard interactions
        run: node tests/frontend_smoke.cjs

      - name: Save the single-file dashboard preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deh-dashboard-preview
          path: dist/DEH_Dashboard_Preview.html
          if-no-files-found: error
          retention-days: 90
